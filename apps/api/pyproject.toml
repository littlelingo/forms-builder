[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "form-builder-api"
version = "0.1.0"
description = "Phase 1 extraction API for the Form Builder platform."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pypdf>=6.0.0",
  "lxml>=5.2.0",
  "PyMuPDF>=1.24.0",
  "pdfminer.six>=20231228",
  "pdfplumber>=0.11.0",
  "rapidfuzz>=3.9.0",
  "ocrmypdf>=16.0.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

